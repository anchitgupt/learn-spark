<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d"><title id="t">One Structured Streaming micro-batch</title><desc id="d">For micro-batch N, the driver reads the latest available source offsets, writes the batch's offset range to offsets/N in the checkpoint, and plans the batch as an incremental query. Executor tasks read that offset range from the source, run stateful operators that load and save versioned state in the state store under state/, and write results to the sink. Only after the sink write finishes does the driver write commits/N. On restart, an offsets entry without a matching commits entry means batch N is re-run with the same offset range.</desc><rect x="20" y="16" width="840" height="488" rx="14" fill="#f8f7f3" stroke="#dedfd5" stroke-width="2"/><text x="48" y="54" font-family="sans-serif" font-size="20" font-weight="600" fill="#29332e">Micro-batch N</text><text x="48" y="78" font-family="sans-serif" font-size="14" fill="#666c63">Numbers show the order of each step</text><rect x="48" y="104" width="160" height="104" rx="10" fill="#ffffff" stroke="#57705e" stroke-width="2"/><text x="128" y="136" font-family="sans-serif" font-size="17" font-weight="600" fill="#29332e" text-anchor="middle">Source</text><text x="128" y="162" font-family="sans-serif" font-size="14" fill="#666c63" text-anchor="middle">replayable</text><text x="128" y="184" font-family="sans-serif" font-size="14" fill="#666c63" text-anchor="middle">offsets / files</text><rect x="276" y="104" width="300" height="104" rx="10" fill="#ffffff" stroke="#29332e" stroke-width="2"/><text x="426" y="136" font-family="sans-serif" font-size="17" font-weight="600" fill="#29332e" text-anchor="middle">Driver</text><text x="426" y="162" font-family="sans-serif" font-size="14" fill="#29332e" text-anchor="middle">1 find offset range for N</text><text x="426" y="184" font-family="sans-serif" font-size="14" fill="#29332e" text-anchor="middle">3 plan an incremental batch</text><line x1="276" y1="140" x2="216" y2="140" stroke="#29332e" stroke-width="2"/><path d="M216 134 L206 140 L216 146 Z" fill="#29332e"/><rect x="644" y="104" width="188" height="104" rx="10" fill="#f6e0d6" stroke="#ae4427" stroke-width="2"/><text x="738" y="134" font-family="sans-serif" font-size="16" font-weight="600" fill="#8d3a20" text-anchor="middle">Checkpoint</text><text x="738" y="160" font-family="sans-serif" font-size="14" fill="#29332e" text-anchor="middle">2 offsets/N</text><text x="738" y="184" font-family="sans-serif" font-size="14" fill="#666c63" text-anchor="middle">written before</text><line x1="576" y1="156" x2="634" y2="156" stroke="#ae4427" stroke-width="2"/><path d="M634 150 L644 156 L634 162 Z" fill="#ae4427"/><line x1="426" y1="208" x2="426" y2="252" stroke="#29332e" stroke-width="2"/><path d="M420 252 L426 262 L432 252 Z" fill="#29332e"/><text x="440" y="240" font-family="sans-serif" font-size="14" fill="#666c63">tasks</text><rect x="48" y="264" width="528" height="120" rx="10" fill="#e9ede4" stroke="#57705e" stroke-width="2"/><text x="72" y="294" font-family="sans-serif" font-size="17" font-weight="600" fill="#29332e">Executor tasks</text><text x="72" y="320" font-family="sans-serif" font-size="14" fill="#29332e">4 read exactly offsets/N from the source</text><rect x="72" y="334" width="220" height="36" rx="8" fill="#ffffff" stroke="#57705e"/><text x="182" y="357" font-family="sans-serif" font-size="14" fill="#29332e" text-anchor="middle">scan · filter · project</text><line x1="292" y1="352" x2="324" y2="352" stroke="#57705e" stroke-width="2"/><path d="M324 346 L334 352 L324 358 Z" fill="#57705e"/><rect x="336" y="334" width="220" height="36" rx="8" fill="#ffffff" stroke="#57705e"/><text x="446" y="357" font-family="sans-serif" font-size="14" fill="#29332e" text-anchor="middle">stateful operator</text><line x1="128" y1="208" x2="128" y2="254" stroke="#57705e" stroke-width="2" stroke-dasharray="6 5"/><path d="M122 254 L128 264 L134 254 Z" fill="#57705e"/><text x="140" y="240" font-family="sans-serif" font-size="14" fill="#666c63">data for N</text><rect x="644" y="264" width="188" height="120" rx="10" fill="#ffffff" stroke="#57705e" stroke-width="2" stroke-dasharray="6 5"/><text x="738" y="294" font-family="sans-serif" font-size="16" font-weight="600" fill="#29332e" text-anchor="middle">State store</text><text x="738" y="320" font-family="sans-serif" font-size="14" fill="#29332e" text-anchor="middle">state/ version N+1</text><text x="738" y="344" font-family="sans-serif" font-size="14" fill="#666c63" text-anchor="middle">load N, save N+1</text><text x="738" y="366" font-family="sans-serif" font-size="14" fill="#666c63" text-anchor="middle">in checkpoint</text><line x1="556" y1="344" x2="634" y2="344" stroke="#57705e" stroke-width="2"/><path d="M634 338 L644 344 L634 350 Z" fill="#57705e"/><line x1="644" y1="362" x2="566" y2="362" stroke="#57705e" stroke-width="2"/><path d="M566 356 L556 362 L566 368 Z" fill="#57705e"/><rect x="48" y="416" width="320" height="64" rx="10" fill="#ffffff" stroke="#29332e" stroke-width="2"/><text x="208" y="444" font-family="sans-serif" font-size="17" font-weight="600" fill="#29332e" text-anchor="middle">5 Sink write</text><text x="208" y="466" font-family="sans-serif" font-size="14" fill="#666c63" text-anchor="middle">idempotent or transactional</text><line x1="310" y1="384" x2="310" y2="406" stroke="#29332e" stroke-width="2"/><path d="M304 406 L310 416 L316 406 Z" fill="#29332e"/><rect x="644" y="416" width="188" height="64" rx="10" fill="#f6e0d6" stroke="#ae4427" stroke-width="2"/><text x="738" y="444" font-family="sans-serif" font-size="16" font-weight="600" fill="#8d3a20" text-anchor="middle">6 commits/N</text><text x="738" y="466" font-family="sans-serif" font-size="14" fill="#666c63" text-anchor="middle">written after</text><line x1="368" y1="448" x2="634" y2="448" stroke="#ae4427" stroke-width="2"/><path d="M634 442 L644 448 L634 454 Z" fill="#ae4427"/><text x="500" y="438" font-family="sans-serif" font-size="14" fill="#666c63" text-anchor="middle">only when the sink succeeds</text><text x="500" y="474" font-family="sans-serif" font-size="14" fill="#ae4427" text-anchor="middle">offsets/N without commits/N: re-run N</text></svg>
