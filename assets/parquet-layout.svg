<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d"><title id="t">Parquet physical file layout</title><desc id="d">A Parquet file holds row groups. Each row group stores one column chunk per column, and each column chunk is split into pages with statistics. The footer at the end holds the schema, row-group offsets, and statistics, and is read first.</desc><rect x="40" y="24" width="800" height="472" rx="14" fill="#f8f7f3" stroke="#c8c9bd" stroke-width="2"/><text x="76" y="68" font-family="sans-serif" font-size="20" font-weight="600" fill="#29332e">Parquet file</text><rect x="72" y="92" width="736" height="176" rx="10" fill="#e9e7f3" stroke="#8f8ab5"/><text x="104" y="130" font-family="sans-serif" font-size="17" font-weight="600" fill="#4a4477">Row group 0</text><rect x="100" y="148" width="212" height="100" rx="8" fill="#e9ede4" stroke="#6c7b64"/><text x="206" y="188" font-family="sans-serif" font-size="15" fill="#29332e" text-anchor="middle">user_id</text><text x="206" y="214" font-family="sans-serif" font-size="12" fill="#5c6459" text-anchor="middle">pages + min/max</text><rect x="336" y="148" width="212" height="100" rx="8" fill="#e9ede4" stroke="#6c7b64"/><text x="442" y="188" font-family="sans-serif" font-size="15" fill="#29332e" text-anchor="middle">event_ts</text><text x="442" y="214" font-family="sans-serif" font-size="12" fill="#5c6459" text-anchor="middle">pages + min/max</text><rect x="572" y="148" width="212" height="100" rx="8" fill="#e9ede4" stroke="#6c7b64"/><text x="678" y="188" font-family="sans-serif" font-size="15" fill="#29332e" text-anchor="middle">amount</text><text x="678" y="214" font-family="sans-serif" font-size="12" fill="#5c6459" text-anchor="middle">pages + min/max</text><rect x="72" y="284" width="736" height="84" rx="10" fill="#e9e7f3" stroke="#8f8ab5" stroke-dasharray="6 5"/><text x="440" y="322" font-family="sans-serif" font-size="16" fill="#4a4477" text-anchor="middle">Row group 1 … N</text><text x="440" y="346" font-family="sans-serif" font-size="12" fill="#5c6459" text-anchor="middle">Same structure repeats</text><rect x="72" y="384" width="736" height="88" rx="10" fill="#f6e0d6" stroke="#b94727"/><text x="440" y="420" font-family="sans-serif" font-size="16" fill="#8d3a20" text-anchor="middle">Footer</text><text x="440" y="444" font-family="sans-serif" font-size="12" fill="#6b4230" text-anchor="middle">Schema · row-group offsets · statistics — read first</text></svg>
