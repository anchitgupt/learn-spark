<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d"><title id="t">Classic Spark application architecture</title><desc id="d">The cluster manager allocates executor resources. The driver schedules tasks on executors, which access external storage.</desc><g fill="none" stroke="#7a8b83" stroke-width="2"><path d="M160 100h115m100 0h115M160 125v75h185m30-75v75h115M340 265v55h150m50-55v55" stroke-dasharray="5 5"/></g><g font-family="sans-serif" font-size="16" text-anchor="middle"><rect x="30" y="55" width="200" height="75" rx="5" fill="#f1e2d9" stroke="#b94727"/><text x="130" y="86" fill="#9d3c20">Driver</text><text x="130" y="111" font-size="12" fill="#464f48">plans and schedules</text><rect x="480" y="55" width="210" height="75" rx="5" fill="#e9ede4" stroke="#6c7b64"/><text x="585" y="85">Cluster manager</text><text x="585" y="110" font-size="12">allocates resources</text><rect x="230" y="170" width="190" height="95" rx="5" fill="#edf0e9" stroke="#6c7b64"/><rect x="480" y="170" width="210" height="95" rx="5" fill="#edf0e9" stroke="#6c7b64"/><text x="325" y="204">Executor A</text><text x="585" y="204">Executor B</text><text x="325" y="235" font-size="12">task · task · cached data</text><text x="585" y="235" font-size="12">task · task · cached data</text><rect x="385" y="300" width="220" height="55" rx="5" fill="#f7f6f2" stroke="#777"/><text x="495" y="333">External storage</text></g></svg>
