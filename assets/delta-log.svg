<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t d"><title id="t">A Delta table: Parquet data files plus an ordered transaction log</title><desc id="d">Left: data files part-A, part-B, part-C, and part-D. Part-B is dashed because commit 1 removed it; the file stays on disk until VACUUM. Middle: the _delta_log directory holds ordered commits. Commit 000…000.json adds A and B; 000…001.json removes B and adds C; commits 2 to 9 follow; 000…010.checkpoint.parquet stores the full table state at version 10; 000…011.json adds D. Right: a reader reads _last_checkpoint, loads checkpoint 10, replays commit 11, and keeps files whose latest action is an add, so snapshot 11 contains A, C, and D and B is invisible. Bottom: two writers that both read version 11 try to create 000…012.json. Writer 1's put-if-absent succeeds and becomes version 12. Writer 2 finds the file already exists, re-checks the new commit for conflicts, and either retries as version 13 or fails with a conflict exception such as ConcurrentAppendException.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#666c63"/></marker></defs><rect x="20" y="16" width="840" height="488" rx="14" fill="#f8f7f3" stroke="#c8c9bd" stroke-width="2"/><text x="48" y="56" font-family="sans-serif" font-size="21" font-weight="600" fill="#29332e">A Delta table = Parquet files + _delta_log</text><text x="48" y="96" font-family="sans-serif" font-size="15" font-weight="600" fill="#666c63">DATA FILES</text><text x="316" y="96" font-family="sans-serif" font-size="15" font-weight="600" fill="#666c63">_delta_log/ (ordered commits)</text><text x="610" y="96" font-family="sans-serif" font-size="15" font-weight="600" fill="#666c63">READER</text><g font-family="sans-serif"><rect x="48" y="110" width="232" height="58" rx="8" fill="#ffffff" stroke="#57705e" stroke-width="2"/><text x="64" y="135" font-size="16" fill="#29332e">part-A.parquet</text><text x="64" y="156" font-size="14" fill="#57705e">live</text><rect x="48" y="180" width="232" height="58" rx="8" fill="none" stroke="#666c63" stroke-width="1.5" stroke-dasharray="6 5"/><text x="64" y="205" font-size="16" fill="#666c63">part-B.parquet</text><text x="64" y="226" font-size="14" fill="#666c63">removed in v1 (tombstone)</text><rect x="48" y="250" width="232" height="58" rx="8" fill="#ffffff" stroke="#57705e" stroke-width="2"/><text x="64" y="275" font-size="16" fill="#29332e">part-C.parquet</text><text x="64" y="296" font-size="14" fill="#57705e">added in v1</text><rect x="48" y="320" width="232" height="58" rx="8" fill="#ffffff" stroke="#57705e" stroke-width="2"/><text x="64" y="345" font-size="16" fill="#29332e">part-D.parquet</text><text x="64" y="366" font-size="14" fill="#57705e">added in v11</text></g><g stroke="#666c63" stroke-width="1.5" fill="none"><line x1="316" y1="135" x2="282" y2="139" marker-end="url(#arrow)"/><line x1="316" y1="195" x2="282" y2="207" marker-end="url(#arrow)" stroke-dasharray="5 4"/><line x1="316" y1="198" x2="282" y2="275" marker-end="url(#arrow)"/><line x1="316" y1="347" x2="282" y2="349" marker-end="url(#arrow)"/></g><g font-family="sans-serif"><rect x="316" y="110" width="258" height="50" rx="8" fill="#ffffff" stroke="#dedfd5" stroke-width="2"/><text x="332" y="132" font-size="15" fill="#29332e">000…000.json</text><text x="332" y="151" font-size="14" fill="#666c63">add A · add B</text><rect x="316" y="170" width="258" height="50" rx="8" fill="#ffffff" stroke="#dedfd5" stroke-width="2"/><text x="332" y="192" font-size="15" fill="#29332e">000…001.json</text><text x="332" y="211" font-size="14" fill="#666c63">remove B · add C</text><text x="332" y="248" font-size="14" fill="#666c63">⋮ commits 2–9</text><rect x="316" y="262" width="258" height="50" rx="8" fill="#e9ede4" stroke="#57705e" stroke-width="2"/><text x="332" y="284" font-size="15" fill="#29332e">000…010.checkpoint.parquet</text><text x="332" y="303" font-size="14" fill="#57705e">full state at v10</text><rect x="316" y="322" width="258" height="50" rx="8" fill="#ffffff" stroke="#dedfd5" stroke-width="2"/><text x="332" y="344" font-size="15" fill="#29332e">000…011.json</text><text x="332" y="363" font-size="14" fill="#666c63">add D</text></g><line x1="608" y1="287" x2="578" y2="287" stroke="#666c63" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="608" y1="347" x2="578" y2="347" stroke="#666c63" stroke-width="1.5" marker-end="url(#arrow)"/><g font-family="sans-serif"><rect x="610" y="110" width="222" height="262" rx="8" fill="#ffffff" stroke="#29332e" stroke-width="1.5"/><text x="626" y="140" font-size="15" fill="#29332e">1  read _last_checkpoint</text><text x="626" y="174" font-size="15" fill="#29332e">2  load checkpoint v10</text><text x="626" y="208" font-size="15" fill="#29332e">3  replay 011.json</text><text x="626" y="242" font-size="15" fill="#29332e">4  keep latest adds</text><line x1="626" y1="264" x2="816" y2="264" stroke="#dedfd5" stroke-width="2"/><text x="626" y="296" font-size="16" font-weight="600" fill="#57705e">Snapshot v11</text><text x="626" y="322" font-size="15" fill="#29332e">files A · C · D</text><text x="626" y="348" font-size="14" fill="#666c63">B is invisible</text></g><line x1="48" y1="392" x2="832" y2="392" stroke="#dedfd5" stroke-width="2"/><g font-family="sans-serif"><text x="48" y="416" font-size="15" font-weight="600" fill="#29332e">Two writers read v11; both try to create 000…012.json</text><rect x="48" y="428" width="372" height="60" rx="8" fill="#e9ede4" stroke="#57705e" stroke-width="2"/><text x="64" y="453" font-size="15" font-weight="600" fill="#57705e">Writer 1: put-if-absent succeeds</text><text x="64" y="475" font-size="14" fill="#29332e">012.json becomes version 12</text><rect x="440" y="428" width="392" height="60" rx="8" fill="#f6e0d6" stroke="#ae4427" stroke-width="2"/><text x="456" y="453" font-size="15" font-weight="600" fill="#ae4427">Writer 2: 012.json already exists</text><text x="456" y="475" font-size="14" fill="#29332e">re-check conflicts → retry as v13, or throw</text></g></svg>
