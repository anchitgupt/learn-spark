<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" role="img" aria-labelledby="t d"><title id="t">Divide the data, share the work</title><desc id="d">One dataset branches into three partitions. Each partition is processed independently.</desc><defs><pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#c9c6bc"/></pattern></defs><rect width="380" height="250" fill="url(#grid)"/><g fill="none" stroke="#aaa99e" stroke-width="1.5"><path d="M190 74V108H67V139M190 108V139M190 108H313V139"/><path d="M67 193v23m123-23v23m123-23v23"/></g><g font-family="monospace" text-anchor="middle"><rect x="133" y="24" width="114" height="50" rx="4" fill="#f7f6f2" stroke="#353f3b"/><text x="190" y="54" font-size="12" fill="#353f3b">your dataset</text><g fill="#f4e4d9" stroke="#bd5738"><rect x="21" y="139" width="92" height="54" rx="4"/><rect x="144" y="139" width="92" height="54" rx="4"/><rect x="267" y="139" width="92" height="54" rx="4"/></g><g fill="#9f3c21" font-size="11"><text x="67" y="171">partition 0</text><text x="190" y="171">partition 1</text><text x="313" y="171">partition 2</text></g><g fill="#53716a"><circle cx="67" cy="222" r="5"/><circle cx="190" cy="222" r="5"/><circle cx="313" cy="222" r="5"/></g><g fill="#bd5738"><circle cx="190" cy="108" r="3"/><circle cx="67" cy="108" r="3"/><circle cx="313" cy="108" r="3"/></g></g></svg>
